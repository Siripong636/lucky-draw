let used = [];
let history = [];

function start(){
  if(used.length === numbers.length){
    alert("เลขถูกใช้ครบแล้ว");
    return;
  }

  const pool = numbers.filter(n => !used.includes(n));
  const final = pool[Math.floor(Math.random()*pool.length)]
                .toString().padStart(5,"0");
  used.push(parseInt(final));

  const digits = document.querySelectorAll(".digit");
  let intervals = [];

  // หมุนเลขทุกหลัก
  digits.forEach((d, i) => {
    intervals[i] = setInterval(() => {
      d.textContent = Math.floor(Math.random()*10);
      d.style.transform = "translateY(-10px)";
      setTimeout(()=>d.style.transform="translateY(0)",100);
    },80);
  });

  // หยุดทีละหลัก
  digits.forEach((d, i) => {
    setTimeout(()=>{
      clearInterval(intervals[i]);
      d.textContent = final[i];

      if(i === digits.length - 1){
        shootConfetti();
        addHistory(final);
      }
    }, 1200 + i*600);
  });
}

function shootConfetti(){
  const duration = 2500;
  const end = Date.now() + duration;

  (function frame(){
    confetti({
      particleCount:7,
      angle:60,
      spread:55,
      origin:{x:0}
    });
    confetti({
      particleCount:7,
      angle:120,
      spread:55,
      origin:{x:1}
    });
    if(Date.now() < end){
      requestAnimationFrame(frame);
    }
  })();
}

function addHistory(num){
  history.unshift(num);
  if(history.length > 5) history.pop();

  const list = document.getElementById("historyList");
  list.innerHTML = "";

  history.forEach(n=>{
    const div = document.createElement("div");
    div.className = "history-item";
    div.textContent = n;
    list.appendChild(div);
  });
}
