<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Draw Event</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

body{
background:#4b1674;
font-family:Arial;
text-align:center;
color:#FFD700;
margin:0;
}

.logo{
margin-top:20px;
}

.title{
font-size:40px;
font-weight:bold;
margin-top:10px;
}

.numbers{
font-size:150px;
letter-spacing:40px;
margin:40px 0;
}

button{
font-size:20px;
padding:15px 35px;
margin:10px;
border:none;
border-radius:12px;
background:#d1007a;
color:white;
cursor:pointer;
}

button:hover{
background:#ff008c;
}

.winner-area{
margin-top:40px;
}

#winnerName{
font-size:28px;
margin-top:10px;
}

#winnerList{
margin-top:30px;
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
font-size:18px;
}

.nameBox{
background:rgba(255,255,255,0.15);
padding:10px 20px;
border-radius:10px;
}

</style>
</head>

<body>

<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Thai_Airways_Logo.svg/512px-Thai_Airways_Logo.svg.png" width="120" class="logo">

<div class="title">Lucky Draw</div>

<div class="numbers" id="numbers">0 0 0 0 0</div>

<div>
<button onclick="draw('DC')">DC</button>
<button onclick="draw('DG')">DG</button>
<button onclick="draw('DXDV')">DX+DV</button>
</div>

<br><br>

<input type="file" id="excelFile">

<div class="winner-area">
<div>Lucky Name</div>
<div id="winnerName">---</div>
</div>

<div id="winnerList"></div>

<script>

let data=[]
let winners=[]

document.getElementById("excelFile").addEventListener("change",handleFile)

function handleFile(e){

const file=e.target.files[0]
const reader=new FileReader()

reader.onload=function(e){

const workbook=XLSX.read(e.target.result,{type:'binary'})
const sheet=workbook.Sheets[workbook.SheetNames[0]]
data=XLSX.utils.sheet_to_json(sheet)

}

reader.readAsBinaryString(file)

}

function draw(category){

let pool=[]

if(category==="DXDV"){
pool=data.filter(x=>x.Category==="DX" || x.Category==="DV")
}
else{
pool=data.filter(x=>x.Category===category)
}

if(pool.length===0){
alert("No data")
return
}

let random=pool[Math.floor(Math.random()*pool.length)]

animateNumber(random.Number)

setTimeout(()=>{

document.getElementById("winnerName").innerText=random.Name

addWinner(random)

fireworks()

},2000)

}

function animateNumber(num){

let str=num.toString().padStart(5,"0")

let interval=setInterval(()=>{

let random=""
for(let i=0;i<5;i++){
random+=Math.floor(Math.random()*10)+" "
}

document.getElementById("numbers").innerText=random

},60)

setTimeout(()=>{

clearInterval(interval)

document.getElementById("numbers").innerText=str.split("").join(" ")

},2000)

}

function addWinner(w){

winners.unshift(w)

if(winners.length>5) winners.pop()

const list=document.getElementById("winnerList")
list.innerHTML=""

winners.forEach(x=>{

let div=document.createElement("div")
div.className="nameBox"
div.textContent=x.Name
list.appendChild(div)

})

}

function fireworks(){

const duration = 1500
const end = Date.now() + duration

(function frame(){

confetti({
particleCount:12,
angle:60,
spread:70,
startVelocity:55,
origin:{x:0,y:1}
})

confetti({
particleCount:12,
angle:120,
spread:70,
startVelocity:55,
origin:{x:1,y:1}
})

if(Date.now() < end){
requestAnimationFrame(frame)
}

})()

}

</script>

</body>
</html>
