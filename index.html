<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Lucky Draw - Thai Airways</title>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:Arial;
background:#370E62;
color:#F5C300;
text-align:center
}

.number{
font-size:clamp(48px,10vw,120px);
letter-spacing:1.5vw;
margin:30px 0
}

.digit{
display:inline-block;
width:1em
}

button{
padding:12px 24px;
margin:10px;
font-size:20px;
border:none;
border-radius:8px;
background:#B6007D;
color:white;
cursor:pointer
}

#winnerName{
font-size:36px;
margin-top:10px;
color:white
}

.history{
margin-top:40px
}

.history-list{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap
}

.history-item{
background:rgba(255,255,255,0.15);
padding:10px 16px;
border-radius:8px;
font-size:20px
}

</style>
</head>

<body>

<h1>Lucky Draw</h1>

<input type="file" id="excelFile" accept=".xlsx">

<div class="number">
<span class="digit">0</span>
<span class="digit">0</span>
<span class="digit">0</span>
<span class="digit">0</span>
<span class="digit">0</span>
</div>

<h2 id="winnerName"></h2>

<div>
<button onclick="start('DC')">สุ่ม DC</button>
<button onclick="start('DG')">สุ่ม DG</button>
<button onclick="start('DXDV')">สุ่ม DX+DV</button>
</div>

<div class="history">
<h3>รายชื่อผู้โชคดี</h3>
<div id="historyList" class="history-list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

let data={DC:[],DG:[],DXDV:[]}
let used={DC:[],DG:[],DXDV:[]}
let history=[]

document.getElementById("excelFile").addEventListener("change",loadExcel)

function loadExcel(e){

const file=e.target.files[0]
const reader=new FileReader()

reader.onload=function(evt){

const workbook=XLSX.read(evt.target.result,{type:'binary'})
const sheet=workbook.Sheets[workbook.SheetNames[0]]
const rows=XLSX.utils.sheet_to_json(sheet)

rows.forEach(r=>{

const obj={
num:parseInt(r.Number),
name:r.Name
}

if(r.Category==="DC") data.DC.push(obj)
if(r.Category==="DG") data.DG.push(obj)
if(r.Category==="DXDV") data.DXDV.push(obj)

})

alert("โหลดรายชื่อสำเร็จ")

}

reader.readAsBinaryString(file)

}

function start(category){

const pool=data[category].filter(n=>!used[category].includes(n.num))

if(pool.length===0){
alert("สุ่มครบแล้วในหมวดนี้")
return
}

const winner=pool[Math.floor(Math.random()*pool.length)]

used[category].push(winner.num)

const finalNumber=winner.num.toString().padStart(5,"0")
const finalName=winner.name

const digits=document.querySelectorAll(".digit")
let intervals=[]

digits.forEach((d,i)=>{
intervals[i]=setInterval(()=>{
d.textContent=Math.floor(Math.random()*10)
},80)
})

digits.forEach((d,i)=>{

setTimeout(()=>{

clearInterval(intervals[i])
d.textContent=finalNumber[i]

if(i===digits.length-1){
showWinner(finalName)
shootConfetti()
}

},1200+i*600)

})

}

function showWinner(name){

document.getElementById("winnerName").textContent=name

history.unshift(name)

if(history.length>5)history.pop()

const list=document.getElementById("historyList")
list.innerHTML=""

history.forEach(n=>{
const div=document.createElement("div")
div.className="history-item"
div.textContent=n
list.appendChild(div)
})

}

function shootConfetti(){

const duration=2500
const end=Date.now()+duration

(function frame(){

confetti({particleCount:7,angle:60,spread:55,origin:{x:0}})
confetti({particleCount:7,angle:120,spread:55,origin:{x:1}})

if(Date.now()<end){
requestAnimationFrame(frame)
}

})()

}

</script>

</body>
</html>
