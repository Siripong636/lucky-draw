<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Lucky Draw - Thai Airways</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:Arial;
background:#370E62;
color:#F5C300;
text-align:center
}

.logo{
margin-top:25px
}

.logo img{
width:180px
}

h1{
font-size:42px;
margin-top:10px
}

.number{
font-size:120px;
letter-spacing:40px;
margin:30px 0
}

.digit{
display:inline-block;
width:1em
}

button{
font-size:20px;
padding:14px 30px;
margin:10px;
border:none;
border-radius:10px;
background:#B6007D;
color:white;
cursor:pointer
}

.winner-board{
margin-top:60px;
display:flex;
justify-content:center;
gap:60px;
flex-wrap:wrap
}

.category{
text-align:left
}

.category h3{
margin-bottom:10px
}

.name{
background:rgba(255,255,255,0.15);
padding:8px 16px;
margin:5px 0;
border-radius:8px
}

</style>
</head>

<body>

<div class="logo">
<img src="logo.png">
</div>

<h1>Lucky Draw</h1>

<div class="number">
<span class="digit">0</span>
<span class="digit">0</span>
<span class="digit">0</span>
<span class="digit">0</span>
<span class="digit">0</span>
</div>

<div>
<button onclick="start('DC')">DC Lucky Draw</button>
<button onclick="start('DG')">DG Lucky Draw</button>
<button onclick="start('DXDV')">DX+DV Lucky Draw</button>
</div>

<div class="winner-board">

<div class="category">
<h3>DC</h3>
<div id="listDC"></div>
</div>

<div class="category">
<h3>DG</h3>
<div id="listDG"></div>
</div>

<div class="category">
<h3>DX+DV</h3>
<div id="listDXDV"></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

const maxWinners={
DC:7,
DG:12,
DXDV:5
}

let data={
DC:[],
DG:[],
DXDV:[]
}

let winners={
DC:[],
DG:[],
DXDV:[]
}

window.onload=function(){
loadExcel()
}

function loadExcel(){

fetch("lucky_draw.xlsx")
.then(res=>res.arrayBuffer())
.then(dataBuffer=>{

const workbook=XLSX.read(dataBuffer,{type:"array"})
const sheet=workbook.Sheets[workbook.SheetNames[0]]
const rows=XLSX.utils.sheet_to_json(sheet)

rows.forEach(r=>{

const obj={
num:parseInt(r.Number),
name:r.Name
}

if(r.Category==="DC")data.DC.push(obj)
if(r.Category==="DG")data.DG.push(obj)

if(r.Category==="DX" || r.Category==="DV"){
data.DXDV.push(obj)
}

})

})

}

function start(category){

if(winners[category].length>=maxWinners[category]){
alert("สุ่มครบ "+maxWinners[category]+" รางวัลแล้ว")
return
}

const usedNumbers=winners[category].map(w=>w.num)

const pool=data[category].filter(n=>!usedNumbers.includes(n.num))

if(pool.length===0){
alert("ไม่มีรายชื่อเหลือ")
return
}

const winner=pool[Math.floor(Math.random()*pool.length)]

winners[category].push(winner)

spinNumber(winner,category)

}

function spinNumber(winner,category){

const finalNumber=winner.num.toString().padStart(5,"0")

const digits=document.querySelectorAll(".digit")

let intervals=[]

digits.forEach((d,i)=>{
intervals[i]=setInterval(()=>{
d.textContent=Math.floor(Math.random()*10)
},80)
})

digits.forEach((d,i)=>{

setTimeout(()=>{

clearInterval(intervals[i])
d.textContent=finalNumber[i]

if(i===digits.length-1){

addWinner(category,winner)

fireworks()

}

},1200+i*600)

})

}

function addWinner(category,winner){

const list=document.getElementById("list"+category)

const div=document.createElement("div")

div.className="name"

div.textContent=winner.num+" "+winner.name

list.appendChild(div)

}

function fireworks(){

const duration=1500
const end=Date.now()+duration

(function frame(){

confetti({
particleCount:8,
angle:60,
spread:70,
origin:{x:0}
})

confetti({
particleCount:8,
angle:120,
spread:70,
origin:{x:1}
})

if(Date.now()<end){
requestAnimationFrame(frame)
}

})()

}

</script>

</body>
</html>
