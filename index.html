<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Lucky Draw - Thai Airways</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:Arial;
background:#370E62;
color:#F5C300;
text-align:center
}

.logo{
margin-top:25px
}

.logo img{
width:180px
}

h1{
font-size:42px;
margin-top:10px
}

.number{
font-size:120px;
letter-spacing:40px;
margin:40px 0
}

.digit{
display:inline-block;
width:1em
}

button{
font-size:20px;
padding:14px 30px;
margin:10px;
border:none;
border-radius:10px;
background:#B6007D;
color:white;
cursor:pointer
}

button:hover{
opacity:0.9
}

.winner-board{
margin-top:60px
}

.winner-list{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin-top:20px
}

.winner-item{
background:rgba(255,255,255,0.15);
padding:10px 20px;
border-radius:10px;
font-size:22px
}

</style>
</head>

<body>

<div class="logo">
<img src="logo.png">
</div>

<h1>Lucky Draw</h1>

<div class="number">
<span class="digit">0</span>
<span class="digit">0</span>
<span class="digit">0</span>
<span class="digit">0</span>
<span class="digit">0</span>
</div>

<div>
<button onclick="start('DC')">DC</button>
<button onclick="start('DG')">DG</button>
<button onclick="start('DXDV')">DX+DV</button>
</div>

<div class="winner-board">
<h3>Lucky Name</h3>
<div id="winnerList" class="winner-list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

const maxWinners={
DC:7,
DG:12,
DXDV:5
}

let data={
DC:[],
DG:[],
DXDV:[]
}

let winners={
DC:[],
DG:[],
DXDV:[]
}

let lastWinners=[]

window.onload=function(){
loadExcel()
}

function loadExcel(){

fetch("lucky_draw.xlsx")
.then(res=>res.arrayBuffer())
.then(dataBuffer=>{

const workbook=XLSX.read(dataBuffer,{type:"array"})
const sheet=workbook.Sheets[workbook.SheetNames[0]]
const rows=XLSX.utils.sheet_to_json(sheet)

rows.forEach(r=>{

const obj={
num:parseInt(r.Number),
name:r.Name,
category:r.Category
}

if(r.Category==="DC")data.DC.push(obj)
if(r.Category==="DG")data.DG.push(obj)

if(r.Category==="DX" || r.Category==="DV"){
data.DXDV.push(obj)
}

})

console.log("Excel Loaded")

})

}

function start(category){

if(winners[category].length>=maxWinners[category]){
alert("สุ่มครบ "+maxWinners[category]+" รางวัลแล้ว")
return
}

const usedNumbers=winners[category].map(w=>w.num)

const pool=data[category].filter(n=>!usedNumbers.includes(n.num))

if(pool.length===0){
alert("ไม่มีรายชื่อเหลือ")
return
}

const winner=pool[Math.floor(Math.random()*pool.length)]

winners[category].push(winner)

spinNumber(winner)

}

function spinNumber(winner){

const finalNumber=winner.num.toString().padStart(5,"0")

const digits=document.querySelectorAll(".digit")

let intervals=[]

digits.forEach((d,i)=>{
intervals[i]=setInterval(()=>{
d.textContent=Math.floor(Math.random()*10)
},80)
})

digits.forEach((d,i)=>{

setTimeout(()=>{

clearInterval(intervals[i])
d.textContent=finalNumber[i]

if(i===digits.length-1){

addWinner(winner)

fireworks()

}

},1200+i*600)

})

}

function addWinner(winner){

lastWinners.unshift(winner)

if(lastWinners.length>5){
lastWinners.pop()
}

const list=document.getElementById("winnerList")
list.innerHTML=""

lastWinners.forEach(w=>{

const div=document.createElement("div")
div.className="winner-item"

if(w.category==="DX" || w.category==="DV"){
div.textContent=w.name+" ("+w.category+")"
}else{
div.textContent=w.name
}

list.appendChild(div)

})

}

function fireworks(){

const duration = 1000
const end = Date.now() + duration

const defaults = {
startVelocity: 60,
spread: 70,
ticks: 200,
zIndex: 9999
}

(function frame(){

confetti({
...defaults,
particleCount:20,
angle:60,
origin:{ x:0.05, y:0.9 }
})

confetti({
...defaults,
particleCount:20,
angle:120,
origin:{ x:0.95, y:0.9 }
})

if(Date.now()<end){
requestAnimationFrame(frame)
}

})()

}

</script>

</body>
</html>
